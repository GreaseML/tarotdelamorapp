<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarô do Amor de Bolso</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#160f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarô do Amor">
<!-- ===== CONFIGURAÇÃO =====
  accessCode: deixe "" para acesso livre pelo link, ou coloque um código (ex.: "AMOR2026")
  e mande esse código no e-mail de entrega. É uma proteção simples, não um login de verdade. -->
<script>window.APP_CONFIG = { accessCode: "" };</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#160f24;--bg2:#1f1533;--card:#271b3f;--line:rgba(240,170,200,.18);--ink:#f7eef2;--mut:#bcaec8;--rose:#f0a3c0;--rose2:#d9779c;--gold:#ecc97e;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 15% 0%,rgba(240,163,192,.16),transparent 55%),radial-gradient(ellipse at 100% 40%,rgba(236,201,126,.08),transparent 45%)}
.serif,h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.1}
em{font-style:italic;color:var(--rose)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + var(--safe))}
header{position:sticky;top:0;z-index:5;background:rgba(22,15,36,.92);backdrop-filter:blur(10px);margin:0 -16px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand b{font:700 22px/1 "Cormorant Garamond",serif}.brand b em{color:var(--rose)}
.brand span{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.sit{display:flex;gap:6px;margin-top:10px}
.sit button{flex:1;padding:8px 6px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut)}
.sit button.on{background:var(--rose);border-color:var(--rose);color:#2a0f1c}
h1{font-size:34px;margin:22px 0 6px}h2{font-size:26px;margin:24px 0 10px}
.sub{color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.list button.item{width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.item .ic{flex:0 0 42px;height:42px;border-radius:12px;background:rgba(240,163,192,.14);display:flex;align-items:center;justify-content:center;color:var(--rose);font-size:20px}
.item b{display:block}.item small{color:var(--mut)}
.item .ar{margin-left:auto;color:var(--rose)}
.btn{display:block;width:100%;padding:16px;border-radius:999px;background:linear-gradient(180deg,#f6b9cf,#e083a6);color:#2a0f1c;font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-size:14px;margin-top:16px;box-shadow:0 10px 26px rgba(240,163,192,.3)}
.btn.ghost{background:none;border:1px solid var(--rose);color:var(--rose);box-shadow:none}
/* cartas */
.table{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:18px}
.slot{width:96px;text-align:center}
.slot small{display:block;font-size:11px;color:var(--mut);margin-top:6px;line-height:1.25;min-height:28px}
.tc{width:96px;height:156px;perspective:800px;cursor:pointer}
.tc .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.tc.flip .in{transform:rotateY(180deg)}
.tc .f,.tc .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--gold)}
.tc .b{background:repeating-linear-gradient(45deg,#3a2552 0 8px,#2f1e45 8px 16px);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:30px}
.tc .f{transform:rotateY(180deg);background:linear-gradient(160deg,#3b2556,#211634);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 4px;color:var(--gold)}
.tc .f .n{font:700 20px/1 "Cormorant Garamond",serif}.tc .f .s{font-size:34px;line-height:1}.tc .f .nm{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#e7d9ef;text-align:center;line-height:1.2}
.tc.big{width:140px;height:228px;margin:0 auto}.tc.big .f .n{font-size:30px}.tc.big .f .s{font-size:52px}.tc.big .f .nm{font-size:11px}
.deal .tc{animation:deal .45s both}@keyframes deal{from{opacity:0;transform:translateY(-30px) rotate(-8deg)}}
.reading{margin-top:18px;display:grid;gap:10px}
.rd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;animation:fade .4s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.rd .pos{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:700}
.rd h3{font-size:22px;margin:4px 0 2px}
.keys{font-size:12px;color:var(--mut)}
.rd p{margin-top:6px}
.hint{text-align:center;color:var(--mut);font-size:13px;margin-top:10px}
textarea,input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:12px;margin-top:8px}
textarea{min-height:80px;resize:vertical}
label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;display:block;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.chips button.on{background:var(--gold);color:#241604;border-color:var(--gold)}
.cl button.cardrow{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.mini{flex:0 0 34px;height:54px;border-radius:6px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:16px;background:#2f1e45}
.cardrow small{display:block;color:var(--mut);font-size:12.5px}
.combo,.qq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:10px}
.combo b{color:var(--rose)}
.qq .no{color:var(--mut);text-decoration:line-through;font-size:13.5px}.qq .yes{font-weight:600;margin-top:4px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.entry .d{font-size:12px;color:var(--mut)}.entry .del{float:right;color:var(--mut);font-size:12px;text-decoration:underline}
.entry ul{list-style:none;margin-top:6px;font-size:13.5px}.entry li b{color:var(--rose)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(22,15,36,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe));display:flex;justify-content:center}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--rose)}
.modal{position:fixed;inset:0;z-index:10;background:rgba(10,6,18,.75);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:20px 18px calc(24px + var(--safe));animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{float:right;color:var(--mut);font-size:24px}
.sitrow{margin-top:12px}.sitrow b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rose)}
.sitrow.cur{background:rgba(240,163,192,.1);border-radius:12px;padding:8px 10px;margin-left:-10px;margin-right:-10px}
.gate{max-width:420px;margin:18vh auto 0;text-align:center;padding:0 22px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe));transform:translateX(-50%);background:var(--rose);color:#2a0f1c;font-weight:700;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
.toast.on{opacity:1}
.foot{text-align:center;color:#8d7f9b;font-size:11.5px;margin-top:30px}
</style>
</head>
<body>
<div id="root"><div class="gate" id="fallback"><div style="font-size:34px;color:#f0a3c0">♥</div><h1>Tarô do <em>Amor</em> de Bolso</h1><p class="sub">Carregando…</p><p class="sub" style="margin-top:14px;font-size:13px">Se esta tela não mudar em alguns segundos, abra pelo link de acesso no navegador do celular (Chrome ou Safari). Visualizadores de arquivo, como o do WhatsApp, não abrem o app.</p></div></div>
<nav id="nav" style="display:none"><div class="in">
  <button data-go="home" class="on"><i>♥</i>Início</button>
  <button data-go="spreads"><i>✦</i>Tiragens</button>
  <button data-go="cards"><i>❖</i>Cartas</button>
  <button data-go="diary"><i>✎</i>Diário</button>
</div></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const D = {"cards": [{"name": "O Louco", "lbl": "0", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 1 da Jornada do Louco", "love": ["Abertura para viver algo novo, sem roteiro. Um encontro inesperado pode surgir.", "Leveza e espontaneidade. Façam algo diferente juntos; cuidado com a falta de compromisso.", "Um recomeço. Você está mais livre do que imagina para seguir."]}, {"name": "O Mago", "lbl": "I", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 1 da Jornada do Louco", "love": ["Você tem charme e iniciativa. Dê o primeiro passo.", "Hora de agir pela relação: proponha, converse, crie.", "Você tem as ferramentas para se reconstruir. Use-as."]}, {"name": "A Sacerdotisa", "lbl": "II", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 1 da Jornada do Louco", "love": ["Sentimentos guardados, talvez de alguém próximo. Escute sua intuição.", "Algo ainda não foi dito. Observe com calma antes de cobrar.", "Recolha-se e escute o que você sente de verdade."]}, {"name": "A Imperatriz", "lbl": "III", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 1 da Jornada do Louco", "love": ["Fase magnética e sensual. Cuide de você e o amor vem.", "Carinho, prazer e cuidado. A relação floresce.", "Nutra a si mesma como nutria o outro."]}, {"name": "O Imperador", "lbl": "IV", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 1 da Jornada do Louco", "love": ["Atração por alguém estável e protetor. Defina o que você quer.", "Estrutura e compromisso. Cuidado com o controle excessivo.", "Coloque limites claros e retome o comando da sua vida."]}, {"name": "O Hierofante", "lbl": "V", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 1 da Jornada do Louco", "love": ["Encontro em ambiente conhecido, família ou amigos. Valores parecidos.", "Compromisso formal, casamento, planos sérios.", "Volte para os seus valores. Busque apoio em quem confia."]}, {"name": "Os Enamorados", "lbl": "VI", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 1 da Jornada do Louco", "love": ["Uma escolha do coração está chegando. Atração forte.", "Escolher o outro de novo, todos os dias. União verdadeira.", "Uma escolha difícil, feita de acordo com o que você valoriza."]}, {"name": "O Carro", "lbl": "VII", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 1 da Jornada do Louco", "love": ["Vá em busca. Saia, circule, tome a iniciativa.", "A relação avança: mudança, viagem, próximo passo.", "Siga em frente com foco. Não olhe para trás agora."]}, {"name": "A Força", "lbl": "VIII", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 2 da Jornada do Louco", "love": ["Autoconfiança atrai. Seja você, sem pressa.", "Paciência e carinho vencem a crise.", "Você é mais forte do que esta dor."]}, {"name": "O Eremita", "lbl": "IX", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 2 da Jornada do Louco", "love": ["Tempo sozinha para se conhecer antes de se envolver.", "Cada um precisa de um espaço. Respeitem isso.", "Recolher-se agora é cura, não solidão."]}, {"name": "A Roda da Fortuna", "lbl": "X", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 2 da Jornada do Louco", "love": ["Reviravolta: alguém aparece quando você menos espera.", "Uma nova fase na relação, para melhor ou para mudar.", "O ciclo virou. O que vem é diferente do que foi."]}, {"name": "A Justiça", "lbl": "XI", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 2 da Jornada do Louco", "love": ["Você atrai o que oferece. Seja clara sobre o que quer.", "Equilíbrio entre os dois. Contas emocionais em dia.", "Cada um colhe o que plantou. Feche as pendências com honestidade."]}, {"name": "O Enforcado", "lbl": "XII", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 2 da Jornada do Louco", "love": ["Espera. Mude o jeito de procurar ou de olhar.", "Relação parada. Mudar o ponto de vista destrava.", "Ainda em suspenso. Pare de forçar uma resposta."]}, {"name": "A Morte", "lbl": "XIII", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 2 da Jornada do Louco", "love": ["Fim de um padrão antigo de escolher parceiros.", "Uma fase acaba para outra nascer. Transformação.", "O fim é real. Deixe ir para algo novo nascer."]}, {"name": "A Temperança", "lbl": "XIV", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 2 da Jornada do Louco", "love": ["Calma. Um amor que se constrói devagar.", "Harmonia e ajuste. Ceder um pouco dos dois lados.", "Cura gradual. Um dia de cada vez."]}, {"name": "O Diabo", "lbl": "XV", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 3 da Jornada do Louco", "love": ["Atração intensa, mas cuidado com o que prende.", "Paixão forte ou dependência. Veja o que é escolha e o que é amarra.", "Ainda preso por apego ou desejo. As correntes estão frouxas."]}, {"name": "A Torre", "lbl": "XVI", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 3 da Jornada do Louco", "love": ["Uma surpresa sacode suas certezas sobre o amor.", "Crise ou revelação. O que é falso cai.", "Ruptura repentina. Doloroso, mas libertador."]}, {"name": "A Estrela", "lbl": "XVII", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 3 da Jornada do Louco", "love": ["Esperança. Abra-se de novo ao amor.", "Fase de renovação e cuidado mútuo.", "Cura e fé no futuro. Você vai amar de novo."]}, {"name": "A Lua", "lbl": "XVIII", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 3 da Jornada do Louco", "love": ["Ilusões e fantasias. Não idealize quem acabou de conhecer.", "Insegurança, ciúme ou algo escondido. Converse antes de imaginar.", "Confusão e saudade. Espere a névoa passar antes de decidir."]}, {"name": "O Sol", "lbl": "XIX", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 3 da Jornada do Louco", "love": ["Alegria, um amor leve e verdadeiro chegando.", "Felicidade, cumplicidade, amor correspondido.", "Você volta a sorrir. O melhor está à frente."]}, {"name": "O Julgamento", "lbl": "XX", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 3 da Jornada do Louco", "love": ["Uma segunda chance, talvez com alguém do passado.", "Renovar votos, perdoar, recomeçar juntos.", "Hora de se perdoar e ouvir o que você aprendeu."]}, {"name": "O Mundo", "lbl": "XXI", "sym": "✦", "group": "Maiores", "keys": "Arcano Maior · Ato 3 da Jornada do Louco", "love": ["Você está inteira. O amor certo encontra quem se basta.", "Relação madura e completa. Ciclo realizado.", "Um ciclo encerrado por completo. Você está pronta para o próximo."]}, {"name": "Ás de Copas", "lbl": "Ás", "sym": "♥", "group": "Copas", "keys": "Ás = começo · Copas = emoções", "love": ["Um novo sentimento começando. Coração aberto.", "Renovação do afeto, um novo começo emocional.", "Seu coração está pronto para se abrir de novo, primeiro para você."]}, {"name": "Dois de Copas", "lbl": "2", "sym": "♥", "group": "Copas", "keys": "2 = escolha · Copas = emoções", "love": ["Conexão recíproca. Alguém que te escolhe também.", "Parceria verdadeira, os dois na mesma sintonia.", "Possibilidade de reconciliação ou de paz entre os dois."]}, {"name": "Três de Copas", "lbl": "3", "sym": "♥", "group": "Copas", "keys": "3 = crescimento · Copas = emoções", "love": ["Diversão, amigos, um encontro que nasce na alegria.", "Celebrem juntos. Tragam leveza de volta.", "Apoie-se nas amigas. Há vida e alegria fora da relação."]}, {"name": "Quatro de Copas", "lbl": "4", "sym": "♥", "group": "Copas", "keys": "4 = estabilidade · Copas = emoções", "love": ["Desinteresse ou não perceber quem se aproxima.", "Tédio ou acomodação. Olhem um para o outro de novo.", "Apatia. Cuidado para não fechar portas por cansaço."]}, {"name": "Cinco de Copas", "lbl": "5", "sym": "♥", "group": "Copas", "keys": "5 = conflito · Copas = emoções", "love": ["Decepção recente ainda doendo.", "Mágoa entre vocês. Olhem para o que ainda está de pé.", "Luto pela relação. Sinta, mas lembre do que ficou."]}, {"name": "Seis de Copas", "lbl": "6", "sym": "♥", "group": "Copas", "keys": "6 = harmonia · Copas = emoções", "love": ["Nostalgia, alguém do passado pode reaparecer.", "Ternura e lembranças boas. Revivam o início.", "Saudade. Lembre do bom sem idealizar o passado."]}, {"name": "Sete de Copas", "lbl": "7", "sym": "♥", "group": "Copas", "keys": "7 = avaliação · Copas = emoções", "love": ["Muitas opções e idealização. Veja quem a pessoa é.", "Fantasias sobre a relação. Separe sonho de realidade.", "Imaginar como poderia ter sido. Volte para o real."]}, {"name": "Oito de Copas", "lbl": "8", "sym": "♥", "group": "Copas", "keys": "8 = movimento · Copas = emoções", "love": ["Deixar para trás o que não alimenta mais.", "Um dos dois sente vontade de ir. Conversem com sinceridade.", "Ir embora foi o passo certo. Siga em busca de mais."]}, {"name": "Nove de Copas", "lbl": "9", "sym": "♥", "group": "Copas", "keys": "9 = quase lá · Copas = emoções", "love": ["Satisfação. Um desejo amoroso pode se realizar.", "Contentamento, a relação está gostosa.", "Você está bem consigo mesma. Aproveite."]}, {"name": "Dez de Copas", "lbl": "10", "sym": "♥", "group": "Copas", "keys": "10 = fim de ciclo · Copas = emoções", "love": ["Felicidade completa, sonho de família e lar.", "Amor maduro, lar feliz, planos de futuro.", "A felicidade que você busca é possível. Não desista dela."]}, {"name": "Valete de Copas", "lbl": "Valete", "sym": "♥", "group": "Copas", "keys": "Valete aprende · Copas = emoções", "love": ["Convite romântico, alguém doce se aproximando.", "Gesto carinhoso, recado de amor.", "Mensagem afetiva, talvez do ex. Escute com calma."]}, {"name": "Cavaleiro de Copas", "lbl": "Cavaleiro", "sym": "♥", "group": "Copas", "keys": "Cavaleiro age · Copas = emoções", "love": ["Declaração, alguém encantador.", "Romantismo, pedido especial.", "Proposta de volta. Pés no chão."]}, {"name": "Rainha de Copas", "lbl": "Rainha", "sym": "♥", "group": "Copas", "keys": "Rainha sente · Copas = emoções", "love": ["Intuição afiada no amor.", "Amor acolhedor e compreensivo.", "Acolh     <button class="item" data-go="cards"><span class="ic">❖</span><span><b>As 78 cartas no amor</b><small>Busque qualquer carta</small></span><span class="ar">›</span></button>
  </div>
  <p class="foot">O tarot é uma ferramenta de reflexão e autoconhecimento. A decisão é sempre sua.</p>`;
}
function reading(ids, positions, noSave, anim){
  const i = sitIdx();
  return `<div class="reading">${ids.map((id,k)=>{ const c=D.cards[id];
    return `<div class="rd" style="${anim&&!anim[k]?"animation:none":""}"><div class="pos">${esc(positions[k])}</div><h3>${esc(c.name)}</h3><div class="keys">${esc(c.keys)}</div><p>${esc(c.love[i])}</p></div>`; }).join("")}</div>`;
}
function spreads(){
  return `<h1>Tiragens do <em>amor</em></h1><p class="sub">Escolha a que combina com o seu momento.</p>
  <div class="list">${D.spreads.map((s,k)=>`<button class="item" data-spread="${k}"><span class="ic">${s.pos.length}</span><span><b>${esc(s.name)}</b><small>${esc(s.desc)}</small></span><span class="ar">›</span></button>`).join("")}</div>`;
}
function spread(){
  const s = D.spreads[state.spread], n = s.pos.length;
  const dealt = state.drawn.length>0, allOpen = dealt && state.flipped.every(Boolean);
  let h = `<button class="sub" data-go="spreads" style="margin-top:16px">‹ Tiragens</button><h1 style="margin-top:8px">${esc(s.name)}</h1><p class="sub">${esc(s.desc)} Pense na sua pergunta enquanto embaralha.</p>`;
  if(!dealt){
    h += `<label>Sua pergunta (opcional)</label><input id="q" placeholder="Ex.: o que posso fazer pela minha relação?" value="${esc(state.q||"")}">
    <div class="table">${s.pos.map(p=>`<div class="slot">${cardEl(D.cards[0],false)}<small>${esc(p)}</small></div>`).join("")}</div>
    <button class="btn" id="deal">Embaralhar e tirar ${n} cartas</button>`;
  } else {
    h += `<div class="table ${state.justDealt?"deal":""}">${s.pos.map((p,k)=>`<div class="slot">${cardEl(D.cards[state.drawn[k]], state.flipped[k], "", `data-flip="${k}" style="animation-delay:${k*.12}s"`)}<small>${esc(p)}</small></div>`).join("")}</div>`;
    if(!allOpen) h += `<p class="hint">Toque em cada carta para revelar.</p>`;
    const open = state.drawn.map((id,k)=>state.flipped[k]?k:-1).filter(k=>k>=0);
    if(open.length) h += reading(open.map(k=>state.drawn[k]), open.map(k=>s.pos[k]), false, open.map(k=>k===state.lastOpen));
    state.justDealt=false;
    if(allOpen) h += `<label>Uma nota para você (opcional)</label><textarea id="note" placeholder="O que essa leitura te diz?"></textarea>
      <button class="btn" id="save">Salvar no diário</button><button class="btn ghost" id="again">Tirar de novo</button>`;
  }
  return h;
}
function cards(){
  const f = state.filter||"Todas", q=(state.search||"").toLowerCase();
  const list = D.cards.map((c,i)=>[c,i]).filter(([c])=>(f==="Todas"||c.group===f) && (!q || c.name.toLowerCase().includes(q)));
  return `<h1>As 78 cartas <em>no amor</em></h1>
  <input id="search" placeholder="Buscar carta, ex.: Três de Copas" value="${esc(state.search||"")}">
  <div class="chips">${["Todas","Maiores","Copas","Paus","Espadas","Ouros"].map(g=>`<button data-filter="${g}" class="${g===f?"on":""}">${g}</button>`).join("")}</div>
  <div class="cl" style="margin-top:8px">${list.map(([c,i])=>`<button class="cardrow" data-card="${i}"><span class="mini">${c.sym}</span><span><b>${esc(c.name)}</b><small>${esc(c.love[sitIdx()].slice(0,70))}${c.love[sitIdx()].length>70?"…":""}</small></span></button>`).join("") || '<p class="hint">Nenhuma carta encontrada.</p>'}</div>`;
}
function combos(){ return `<button class="sub" data-go="home" style="margin-top:16px">‹ Início</button><h1 style="margin-top:8px">Combinações <em>do amor</em></h1><p class="sub">Quando estas cartas saem juntas numa leitura, a mensagem fica mais forte.</p>${D.combos.map(c=>`<div class="combo"><b>${esc(c[0])}</b><p>${esc(c[1])}</p></div>`).join("")}`; }
function questions(){ return `<button class="sub" data-go="home" style="margin-top:16px">‹ Início</button><h1 style="margin-top:8px">Perguntas que <em>funcionam</em></h1>
  <div class="box"><b>As 3 regras</b><p style="margin-top:6px">1. Pergunte sobre você, não sobre a cabeça do outro.<br>2. Pergunte "o que" e "como", não "se" e "quando".<br>3. Peça um próximo passo: "o que posso fazer…?"</p></div>
  ${D.questions.map(q=>`<div class="qq"><div class="no">${esc(q[0])}</div><div class="yes">${esc(q[1])}</div></div>`).join("")}`; }
function diary(){
  const es = store.get("diary",[]);
  return `<h1>Seu <em>diário</em></h1><p class="sub">Suas leituras ficam salvas neste aparelho. Releia de vez em quando: você vai ver padrões.</p>
  ${es.length? es.map((e,k)=>`<div class="entry"><button class="del" data-del="${k}">apagar</button><div class="d">${esc(e.date)} · ${esc(e.spread)} · ${esc(SIT.find(s=>s[0]===e.sit)?.[1]||"")}</div>${e.q?`<p style="margin-top:4px"><b>${esc(e.q)}</b></p>`:""}<ul>${e.cards.map(c=>`<li><b>${esc(c[0])}:</b> ${esc(c[1])}</li>`).join("")}</ul>${e.note?`<p style="margin-top:6px;color:var(--mut)">${esc(e.note)}</p>`:""}</div>`).join("") : '<div class="box" style="text-align:center"><p>Nenhuma leitura salva ainda.</p><button class="btn" data-go="spreads">Fazer uma tiragem</button></div>'}`;
}
function openCard(i){
  const c=D.cards[i], cur=sitIdx();
  $("#sheet").innerHTML = `<button class="x" id="close">×</button><div style="clear:both">${cardEl(c,true,"big")}</div><h2 style="text-align:center;margin-top:14px">${esc(c.name)}</h2><p class="keys" style="text-align:center">${esc(c.keys)}</p>
  ${SIT.map((s,k)=>`<div class="sitrow ${k===cur?"cur":""}"><b>${s[1]}</b><p>${esc(c.love[k])}</p></div>`).join("")}`;
  $("#modal").classList.add("on");
}
function render(){
  const v = state.view, map = {home, spreads, spread, cards, combos, questions, diary};
  $("#root").innerHTML = `<div class="app">${header()}${(map[v]||home)()}</div>`;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.go===v || (v==="spread"&&b.dataset.go==="spreads") || ((v==="combos"||v==="questions")&&b.dataset.go==="home")));
  const s=$("#search"); if(s){ s.oninput=()=>{ state.search=s.value; const p=s.selectionStart; render(); const n=$("#search"); n.focus(); n.setSelectionRange(p,p); }; }
}
function go(v){ state.view=v; if(v!=="spread"){ state.drawn=[]; state.flipped=[]; } render(); window.scrollTo(0,0); }
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-sit],[data-spread],[data-flip],[data-card],[data-filter],[data-del],#deal,#save,#again,#dailyCard,#close,#modal");
  if(!t) return;
  if(t.id==="modal" && e.target!==t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.sit){ state.sit=t.dataset.sit; store.set("sit",state.sit); render(); return; }
  if(t.dataset.spread){ state.spread=+t.dataset.spread; state.q=""; go("spread"); return; }
  if(t.dataset.filter){ state.filter=t.dataset.filter; render(); return; }
  if(t.dataset.card){ openCard(+t.dataset.card); return; }
  if(t.dataset.del){ const es=store.get("diary",[]); es.splice(+t.dataset.del,1); store.set("diary",es); render(); return; }
  if(t.dataset.flip!==undefined){ const k=+t.dataset.flip; if(!state.flipped[k]){ state.flipped[k]=true; state.lastOpen=k; t.classList.add("flip"); setTimeout(render,450); } return; }
  if(t.id==="deal"){ const q=$("#q"); state.q=q?q.value.trim():""; const n=D.spreads[state.spread].pos.length; state.drawn=shuffle(n); state.flipped=Array(n).fill(false); state.justDealt=true; state.lastOpen=-1; render(); return; }
  if(t.id==="again"){ state.drawn=[]; state.flipped=[]; render(); return; }
  if(t.id==="save"){ const s=D.spreads[state.spread], i=sitIdx(); const es=store.get("diary",[]);
    es.unshift({date:new Date().toLocaleDateString("pt-BR"), spread:s.name, sit:state.sit, q:state.q||"", note:($("#note")||{}).value||"", cards:state.drawn.map((id,k)=>[s.pos[k], D.cards[id].name])});
    store.set("diary",es); toast("Salvo no diário ♥"); return; }
  if(t.id==="dailyCard"){ state.daily=shuffle(1)[0]; store.set("daily",{d:today(),c:state.daily}); t.classList.add("flip"); setTimeout(render,500); return; }
  if(t.id==="close"||t.id==="modal"){ $("#modal").classList.remove("on"); return; }
});
function start(){ document.getElementById("nav").style.display=""; render(); }
(function gate(){
  const code=(window.APP_CONFIG||{}).accessCode;
  if(!code || store.get("ok","")===code){ start(); return; }
  document.getElementById("nav").style.display="none";
  $("#root").innerHTML = `<div class="gate"><div style="font-size:34px;color:var(--rose)">♥</div><h1>Tarô do <em>Amor</em> de Bolso</h1><p class="sub">Digite o código de acesso que chegou no seu e-mail.</p><input id="code" placeholder="Código de acesso" autocomplete="off"><button class="btn" id="enter">Entrar</button><p class="hint" id="err"></p></div>`;
  const tryIt=()=>{ if($("#code").value.trim().toUpperCase()===String(code).toUpperCase()){ store.set("ok",code); start(); } else { $("#err").textContent="Código incorreto. Confira o e-mail de compra."; } };
  $("#enter").onclick=tryIt; $("#code").onkeydown=e=>{ if(e.key==="Enter") tryIt(); };
})();
</script>
</body>
</html>

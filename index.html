<style>
:root{--bg:#160f24;--bg2:#1f1533;--card:#271b3f;--line:rgba(240,170,200,.18);--ink:#f7eef2;--mut:#bcaec8;--rose:#f0a3c0;--rose2:#d9779c;--gold:#ecc97e;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 15% 0%,rgba(240,163,192,.16),transparent 55%),radial-gradient(ellipse at 100% 40%,rgba(236,201,126,.08),transparent 45%)}
.serif,h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.1}
em{font-style:italic;color:var(--rose)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + var(--safe))}
header{position:sticky;top:0;z-index:5;background:rgba(22,15,36,.92);backdrop-filter:blur(10px);margin:0 -16px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand b{font:700 22px/1 "Cormorant Garamond",serif}.brand b em{color:var(--rose)}
.brand span{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.sit{display:flex;gap:6px;margin-top:10px}
.sit button{flex:1;padding:8px 6px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut)}
.sit button.on{background:var(--rose);border-color:var(--rose);color:#2a0f1c}
h1{font-size:34px;margin:22px 0 6px}h2{font-size:26px;margin:24px 0 10px}
.sub{color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.list button.item{width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.item .ic{flex:0 0 42px;height:42px;border-radius:12px;background:rgba(240,163,192,.14);display:flex;align-items:center;justify-content:center;color:var(--rose);font-size:20px}
.item b{display:block}.item small{color:var(--mut)}
.item .ar{margin-left:auto;color:var(--rose)}
.btn{display:block;width:100%;padding:16px;border-radius:999px;background:linear-gradient(180deg,#f6b9cf,#e083a6);color:#2a0f1c;font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-size:14px;margin-top:16px;box-shadow:0 10px 26px rgba(240,163,192,.3)}
.btn.ghost{background:none;border:1px solid var(--rose);color:var(--rose);box-shadow:none}
/* cartas */
.table{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:18px}
.slot{width:96px;text-align:center}
.slot small{display:block;font-size:11px;color:var(--mut);margin-top:6px;line-height:1.25;min-height:28px}
.tc{width:96px;height:156px;perspective:800px;cursor:pointer}
.tc .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.tc.flip .in{transform:rotateY(180deg)}
.tc .f,.tc .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--gold)}
.tc .b{background:repeating-linear-gradient(45deg,#3a2552 0 8px,#2f1e45 8px 16px);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:30px}
.tc .f{transform:rotateY(180deg);background:linear-gradient(160deg,#3b2556,#211634);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 4px;color:var(--gold)}
.tc .f .n{font:700 20px/1 "Cormorant Garamond",serif}.tc .f .s{font-size:34px;line-height:1}.tc .f .nm{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#e7d9ef;text-align:center;line-height:1.2}
.tc.big{width:140px;height:228px;margin:0 auto}.tc.big .f .n{font-size:30px}.tc.big .f .s{font-size:52px}.tc.big .f .nm{font-size:11px}
.deal .tc{animation:deal .45s both}@keyframes deal{from{opacity:0;transform:translateY(-30px) rotate(-8deg)}}
.reading{margin-top:18px;display:grid;gap:10px}
.rd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;animation:fade .4s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.rd .pos{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:700}
.rd h3{font-size:22px;margin:4px 0 2px}
.keys{font-size:12px;color:var(--mut)}
.rd p{margin-top:6px}
.hint{text-align:center;color:var(--mut);font-size:13px;margin-top:10px}
textarea,input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:12px;margin-top:8px}
textarea{min-height:80px;resize:vertical}
label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;display:block;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.chips button.on{background:var(--gold);color:#241604;border-color:var(--gold)}
.cl button.cardrow{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.mini{flex:0 0 34px;height:54px;border-radius:6px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:16px;background:#2f1e45}
.cardrow small{display:block;color:var(--mut);font-size:12.5px}
.combo,.qq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:10px}
.combo b{color:var(--rose)}
.qq .no{color:var(--mut);text-decoration:line-through;font-size:13.5px}.qq .yes{font-weight:600;margin-top:4px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.entry .d{font-size:12px;color:var(--mut)}.entry .del{float:right;color:var(--mut);font-size:12px;text-decoration:underline}
.entry ul{list-style:none;margin-top:6px;font-size:13.5px}.entry li b{color:var(--rose)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(22,15,36,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe));display:flex;justify-content:center}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--rose)}
.modal{position:fixed;inset:0;z-index:10;background:rgba(10,6,18,.75);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:20px 18px calc(24px + var(--safe));animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{float:right;color:var(--mut);font-size:24px}
.sitrow{margin-top:12px}.sitrow b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rose)}
.sitrow.cur{background:rgba(240,163,192,.1);border-radius:12px;padding:8px 10px;margin-left:-10px;margin-right:-10px}
.gate{max-width:420px;margin:18vh auto 0;text-align:center;padding:0 22px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe));transform:translateX(-50%);background:var(--rose);color:#2a0f1c;font-weight:700;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
.toast.on{opacity:1}
.foot{text-align:center;color:#8d7f9b;font-size:11.5px;margin-top:30px}
</style>
</head>
<body>
<div id="root"><div class="gate" id="fallback"><div style="font-size:34px;color:#f0a3c0">♥</div><h1>Tarot del <em>Amor</em> de Bolsillo</h1><p class="sub">Cargando…</p><p class="sub" style="margin-top:14px;font-size:13px">Si esta pantalla no cambia en unos segundos, ábrela desde el enlace de acceso en el navegador del móvil (Chrome o Safari). Los visores de archivos, como el de WhatsApp, no abren la app.</p></div></div>
<nav id="nav" style="display:none"><div class="in">
  <button data-go="home" class="on"><i>♥</i>Inicio</button>
  <button data-go="spreads"><i>✦</i>Tiradas</button>
  <button data-go="cards"><i>❖</i>Cartas</button>
  <button data-go="diary"><i>✎</i>Diario</button>
</div></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const D = {"cards": [{"name": "El Loco", "lbl": "0", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 1 del Viaje del Loco", "love": ["Apertura para vivir algo nuevo, sin guion. Puede surgir un encuentro inesperado.", "Ligereza y espontaneidad. Haced algo diferente juntos; cuidado con la falta de compromiso.", "Un nuevo comienzo. Eres más libre de lo que imaginas para seguir."]}, {"name": "El Mago", "lbl": "I", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 1 del Viaje del Loco", "love": ["Tienes encanto e iniciativa. Da el primer paso.", "Momento de actuar por la relación: propón, habla, crea.", "Tienes las herramientas para reconstruirte. Úsalas."]}, {"name": "La Sacerdotisa", "lbl": "II", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 1 del Viaje del Loco", "love": ["Sentimientos guardados, quizá de alguien cercano. Escucha tu intuición.", "Algo todavía no se ha dicho. Observa con calma antes de exigir.", "Recógete y escucha lo que sientes de verdad."]}, {"name": "La Emperatriz", "lbl": "III", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 1 del Viaje del Loco", "love": ["Etapa magnética y sensual. Cuídate y el amor llega.", "Cariño, placer y cuidado. La relación florece.", "Nútrete a ti misma como nutrías al otro."]}, {"name": "El Emperador", "lbl": "IV", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 1 del Viaje del Loco", "love": ["Atracción por alguien estable y protector. Define lo que quieres.", "Estructura y compromiso. Cuidado con el exceso de control.", "Pon límites claros y retoma el mando de tu vida."]}, {"name": "El Hierofante", "lbl": "V", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 1 del Viaje del Loco", "love": ["Encuentro en un ambiente conocido, familia o amigos. Valores parecidos.", "Compromiso formal, boda, planes serios.", "Vuelve a tus valores. Busca apoyo en quien confías."]}, {"name": "Los Enamorados", "lbl": "VI", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 1 del Viaje del Loco", "love": ["Se acerca una elección del corazón. Atracción fuerte.", "Elegir al otro de nuevo, cada día. Unión verdadera.", "Una elección difícil, tomada según lo que valoras."]}, {"name": "El Carro", "lbl": "VII", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 1 del Viaje del Loco", "love": ["Ve a buscarlo. Sal, muévete, toma la iniciativa.", "La relación avanza: mudanza, viaje, siguiente paso.", "Sigue adelante con foco. No mires atrás ahora."]}, {"name": "La Fuerza", "lbl": "VIII", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 2 del Viaje del Loco", "love": ["La confianza en ti misma atrae. Sé tú, sin prisa.", "La paciencia y el cariño vencen la crisis.", "Eres más fuerte que este dolor."]}, {"name": "El Ermitaño", "lbl": "IX", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 2 del Viaje del Loco", "love": ["Tiempo a solas para conocerte antes de implicarte.", "Cada uno necesita su espacio. Respetadlo.", "Recogerse ahora es curación, no soledad."]}, {"name": "La Rueda de la Fortuna", "lbl": "X", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 2 del Viaje del Loco", "love": ["Un giro: alguien aparece cuando menos lo esperas.", "Una nueva etapa en la relación, para mejor o para cambiar.", "El ciclo ha girado. Lo que viene es distinto de lo que fue."]}, {"name": "La Justicia", "lbl": "XI", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 2 del Viaje del Loco", "love": ["Atraes lo que ofreces. Ten claro lo que quieres.", "Equilibrio entre los dos. Cuentas emocionales al día.", "Cada uno recoge lo que sembró. Cierra lo pendiente con honestidad."]}, {"name": "El Colgado", "lbl": "XII", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 2 del Viaje del Loco", "love": ["Espera. Cambia la forma de buscar o de mirar.", "Relación parada. Cambiar el punto de vista la desbloquea.", "Todavía en suspenso. Deja de forzar una respuesta."]}, {"name": "La Muerte", "lbl": "XIII", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 2 del Viaje del Loco", "love": ["Fin de una vieja forma de elegir pareja.", "Una etapa termina para que nazca otra. Transformación.", "El final es real. Déjalo ir para que nazca algo nuevo."]}, {"name": "La Templanza", "lbl": "XIV", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 2 del Viaje del Loco", "love": ["Calma. Un amor que se construye despacio.", "Armonía y ajuste. Ceder un poco por las dos partes.", "Curación gradual. Un día cada vez."]}, {"name": "El Diablo", "lbl": "XV", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 3 del Viaje del Loco", "love": ["Atracción intensa, pero cuidado con lo que ata.", "Pasión fuerte o dependencia. Mira qué es elección y qué es atadura.", "Todavía atada por apego o deseo. Las cadenas están flojas."]}, {"name": "La Torre", "lbl": "XVI", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 3 del Viaje del Loco", "love": ["Una sorpresa sacude tus certezas sobre el amor.", "Crisis o revelación. Lo que es falso cae.", "Ruptura repentina. Dolorosa, pero liberadora."]}, {"name": "La Estrella", "lbl": "XVII", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 3 del Viaje del Loco", "love": ["Esperanza. Ábrete de nuevo al amor.", "Etapa de renovación y cuidado mutuo.", "Curación y fe en el futuro. Volverás a amar."]}, {"name": "La Luna", "lbl": "XVIII", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 3 del Viaje del Loco", "love": ["Ilusiones y fantasías. No idealices a quien acabas de conocer.", "Inseguridad, celos o algo oculto. Habla antes de imaginar.", "Confusión y añoranza. Espera a que pase la niebla antes de decidir."]}, {"name": "El Sol", "lbl": "XIX", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 3 del Viaje del Loco", "love": ["Alegría: llega un amor ligero y verdadero.", "Felicidad, complicidad, amor correspondido.", "Vuelves a sonreír. Lo mejor está por delante."]}, {"name": "El Juicio", "lbl": "XX", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 3 del Viaje del Loco", "love": ["Una segunda oportunidad, quizá con alguien del pasado.", "Renovar votos, perdonar, empezar de nuevo juntos.", "Momento de perdonarte y escuchar lo que has aprendido."]}, {"name": "El Mundo", "lbl": "XXI", "sym": "✦", "group": "Mayores", "keys": "Arcano Mayor · Acto 3 del Viaje del Loco", "love": ["Estás entera. El amor adecuado encuentra a quien se basta.", "Relación madura y completa. Ciclo cumplido.", "Un ciclo cerrado del todo. Estás lista para el siguiente."]}, {"name": "As de Copas", "lbl": "As", "sym": "♥", "group": "Copas", "keys": "As = comienzo · Copas = emociones", "love": ["Un sentimiento nuevo que empieza. Corazón abierto.", "Renovación del cariño, un nuevo comienzo emocional.", "Tu corazón está listo para abrirse de nuevo, primero a ti."]}, {"name": "Dos de Copas", "lbl": "2", "sym": "♥", "group": "Copas", "keys": "2 = elección · Copas = emociones", "love": ["Conexión recíproca. Alguien que también te elige.", "Pareja de verdad, los dos en la misma sintonía.", "Posibilidad de reconciliación o de paz entre los dos."]}, {"name": "Tres de Copas", "lbl": "3", "sym": "♥", "group": "Copas", "keys": "3 = crecimiento · Copas = emociones", "love": ["Diversión, amigos, un encuentro que nace en la alegría.", "Celebrad juntos. Traed la ligereza de vuelta.", "Apóyate en tus amigas. Hay vida y alegría fuera de la relación."]}, {"name": "Cuatro de Copas", "lbl": "4", "sym": "♥", "group": "Copas", "keys": "4 = estabilidad · Copas = emociones", "love": ["Desinterés o no ver a quien se acerca.", "Aburrimiento o acomodo. Volved a miraros.", "Apatía. Cuidado con cerrar puertas por cansancio."]}, {"name": "Cinco de Copas", "lbl": "5", "sym": "♥", "group": "Copas", "keys": "5 = conflicto · Copas = emociones", "love": ["Una decepción reciente que todavía duele.", "Dolor entre vosotros. Mirad lo que sigue en pie.", "Duelo por la relación. Siéntelo, pero recuerda lo que quedó."]}, {"name": "Seis de Copas", "lbl": "6", "sym": "♥", "group": "Copas", "keys": "6 = armonía · Copas = emociones", "love": ["Nostalgia: alguien del pasado puede reaparecer.", "Ternura y buenos recuerdos. Revivid el principio.", "Añoranza. Recuerda lo bueno sin idealizar el pasado."]}, {"name": "Siete de Copas", "lbl": "7", "sym": "♥", "group": "Copas", "keys": "7 = evaluación · Copas = emociones", "love": ["Muchas opciones e idealización. Mira cómo es la persona.", "Fantasías sobre la relación. Separa el sueño de la realidad.", "Imaginar cómo podría haber sido. Vuelve a lo real."]}, {"name": "Ocho de Copas", "lbl": "8", "sym": "♥", "group": "Copas", "keys": "8 = movimiento · Copas = emociones", "love": ["Dejar atrás lo que ya no te alimenta.", "Uno de los dos siente ganas de irse. Hablad con sinceridad.", "Irte fue el paso correcto. Sigue buscando algo más."]}, {"name": "Nueve de Copas", "lbl": "9", "sym": "♥", "group": "Copas", "keys": "9 = a punto · Copas = emociones", "love": ["Satisfacción. Un deseo amoroso puede cumplirse.", "Contento, la relación está a gusto.", "Estás bien contigo misma. Disfrútalo."]}, {"name": "Diez de Copas", "lbl": "10", "sym": "♥", "group": "Copas", "keys": "10 = fin de ciclo · Copas = emociones", "love": ["Felicidad completa, sueño de familia y hogar.", "Amor maduro, hogar feliz, planes de futuro.", "La felicidad que buscas es posible. No renuncies a ella."]}, {"name": "Sota de Copas", "lbl": "Sota", "sym": "♥", "group": "Copas", "keys": "Sota aprende · Copas = emociones", "love": ["Invitación romántica, alguien dulce se acerca.", "Un gesto cariñoso, un mensaje de amor.", "Un mensaje afectivo, quizá del ex. Escúchalo con calma."]}, {"name": "Caballo de Copas", "lbl": "Caballo", "sym": "♥", "group": "Copas", "keys": "Caballo actúa · Copas = emociones", "love": ["Declaración, alguien encantador.", "Romanticismo, una petición especial.", "Propuesta de volver. Con los pies en el suelo."]}, {"name": "Reina de Copas", "lbl": "R     <button class="item" data-go="combos"><span class="ic">∞</span><span><b>Combinaciones del amor</b><small>Parejas de cartas y lo que dicen juntas</small></span><span class="ar">›</span></button>
    <button class="item" data-go="questions"><span class="ic">?</span><span><b>Preguntas que funcionan</b><small>Cambia «¿me quiere?» por algo mejor</small></span><span class="ar">›</span></button>
    <button class="item" data-go="cards"><span class="ic">❖</span><span><b>Las 78 cartas en el amor</b><small>Busca cualquier carta</small></span><span class="ar">›</span></button>
  </div>
  <p class="foot">El tarot es una herramienta de reflexión y autoconocimiento. La decisión siempre es tuya.</p>`;
}
function reading(ids, positions, noSave, anim){
  const i = sitIdx();
  return `<div class="reading">${ids.map((id,k)=>{ const c=D.cards[id];
    return `<div class="rd" style="${anim&&!anim[k]?"animation:none":""}"><div class="pos">${esc(positions[k])}</div><h3>${esc(c.name)}</h3><div class="keys">${esc(c.keys)}</div><p>${esc(c.love[i])}</p></div>`; }).join("")}</div>`;
}
function spreads(){
  return `<h1>Tiradas del <em>amor</em></h1><p class="sub">Elige la que encaja con tu momento.</p>
  <div class="list">${D.spreads.map((s,k)=>`<button class="item" data-spread="${k}"><span class="ic">${s.pos.length}</span><span><b>${esc(s.name)}</b><small>${esc(s.desc)}</small></span><span class="ar">›</span></button>`).join("")}</div>`;
}
function spread(){
  const s = D.spreads[state.spread], n = s.pos.length;
  const dealt = state.drawn.length>0, allOpen = dealt && state.flipped.every(Boolean);
  let h = `<button class="sub" data-go="spreads" style="margin-top:16px">‹ Tiradas</button><h1 style="margin-top:8px">${esc(s.name)}</h1><p class="sub">${esc(s.desc)} Piensa en tu pregunta mientras barajas.</p>`;
  if(!dealt){
    h += `<label>Tu pregunta (opcional)</label><input id="q" placeholder="Ej.: ¿qué puedo hacer por mi relación?" value="${esc(state.q||"")}">
    <div class="table">${s.pos.map(p=>`<div class="slot">${cardEl(D.cards[0],false)}<small>${esc(p)}</small></div>`).join("")}</div>
    <button class="btn" id="deal">Barajar y sacar ${n} cartas</button>`;
  } else {
    h += `<div class="table ${state.justDealt?"deal":""}">${s.pos.map((p,k)=>`<div class="slot">${cardEl(D.cards[state.drawn[k]], state.flipped[k], "", `data-flip="${k}" style="animation-delay:${k*.12}s"`)}<small>${esc(p)}</small></div>`).join("")}</div>`;
    if(!allOpen) h += `<p class="hint">Toca cada carta para revelarla.</p>`;
    const open = state.drawn.map((id,k)=>state.flipped[k]?k:-1).filter(k=>k>=0);
    if(open.length) h += reading(open.map(k=>state.drawn[k]), open.map(k=>s.pos[k]), false, open.map(k=>k===state.lastOpen));
    state.justDealt=false;
    if(allOpen) h += `<label>Una nota para ti (opcional)</label><textarea id="note" placeholder="¿Qué te dice esta lectura?"></textarea>
      <button class="btn" id="save">Guardar en el diario</button><button class="btn ghost" id="again">Sacar de nuevo</button>`;
  }
  return h;
}
function cards(){
  const f = state.filter||"Todas", q=(state.search||"").toLowerCase();
  const list = D.cards.map((c,i)=>[c,i]).filter(([c])=>(f==="Todas"||c.group===f) && (!q || c.name.toLowerCase().includes(q)));
  return `<h1>Las 78 cartas <em>en el amor</em></h1>
  <input id="search" placeholder="Buscar carta, ej.: Tres de Copas" value="${esc(state.search||"")}">
  <div class="chips">${["Todas","Mayores","Copas","Bastos","Espadas","Oros"].map(g=>`<button data-filter="${g}" class="${g===f?"on":""}">${g}</button>`).join("")}</div>
  <div class="cl" style="margin-top:8px">${list.map(([c,i])=>`<button class="cardrow" data-card="${i}"><span class="mini">${c.sym}</span><span><b>${esc(c.name)}</b><small>${esc(c.love[sitIdx()].slice(0,70))}${c.love[sitIdx()].length>70?"…":""}</small></span></button>`).join("") || '<p class="hint">No se ha encontrado ninguna carta.</p>'}</div>`;
}
function combos(){ return `<button class="sub" data-go="home" style="margin-top:16px">‹ Inicio</button><h1 style="margin-top:8px">Combinaciones <em>del amor</em></h1><p class="sub">Cuando estas cartas salen juntas en una lectura, el mensaje se hace más fuerte.</p>${D.combos.map(c=>`<div class="combo"><b>${esc(c[0])}</b><p>${esc(c[1])}</p></div>`).join("")}`; }
function questions(){ return `<button class="sub" data-go="home" style="margin-top:16px">‹ Inicio</button><h1 style="margin-top:8px">Preguntas que <em>funcionan</em></h1>
  <div class="box"><b>Las 3 reglas</b><p style="margin-top:6px">1. Pregunta por ti, no por lo que piensa el otro.<br>2. Pregunta «qué» y «cómo», no «si» y «cuándo».<br>3. Pide un siguiente paso: «¿qué puedo hacer…?»</p></div>
  ${D.questions.map(q=>`<div class="qq"><div class="no">${esc(q[0])}</div><div class="yes">${esc(q[1])}</div></div>`).join("")}`; }
function diary(){
  const es = store.get("diary",[]);
  return `<h1>Tu <em>diario</em></h1><p class="sub">Tus lecturas se guardan en este dispositivo. Reléelas de vez en cuando: verás patrones.</p>
  ${es.length? es.map((e,k)=>`<div class="entry"><button class="del" data-del="${k}">borrar</button><div class="d">${esc(e.date)} · ${esc(e.spread)} · ${esc(SIT.find(s=>s[0]===e.sit)?.[1]||"")}</div>${e.q?`<p style="margin-top:4px"><b>${esc(e.q)}</b></p>`:""}<ul>${e.cards.map(c=>`<li><b>${esc(c[0])}:</b> ${esc(c[1])}</li>`).join("")}</ul>${e.note?`<p style="margin-top:6px;color:var(--mut)">${esc(e.note)}</p>`:""}</div>`).join("") : '<div class="box" style="text-align:center"><p>Todavía no hay lecturas guardadas.</p><button class="btn" data-go="spreads">Hacer una tirada</button></div>'}`;
}
function openCard(i){
  const c=D.cards[i], cur=sitIdx();
  $("#sheet").innerHTML = `<button class="x" id="close">×</button><div style="clear:both">${cardEl(c,true,"big")}</div><h2 style="text-align:center;margin-top:14px">${esc(c.name)}</h2><p class="keys" style="text-align:center">${esc(c.keys)}</p>
  ${SIT.map((s,k)=>`<div class="sitrow ${k===cur?"cur":""}"><b>${s[1]}</b><p>${esc(c.love[k])}</p></div>`).join("")}`;
  $("#modal").classList.add("on");
}
function render(){
  const v = state.view, map = {home, spreads, spread, cards, combos, questions, diary};
  $("#root").innerHTML = `<div class="app">${header()}${(map[v]||home)()}</div>`;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.go===v || (v==="spread"&&b.dataset.go==="spreads") || ((v==="combos"||v==="questions")&&b.dataset.go==="home")));
  const s=$("#search"); if(s){ s.oninput=()=>{ state.search=s.value; const p=s.selectionStart; render(); const n=$("#search"); n.focus(); n.setSelectionRange(p,p); }; }
}
function go(v){ state.view=v; if(v!=="spread"){ state.drawn=[]; state.flipped=[]; } render(); window.scrollTo(0,0); }
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-sit],[data-spread],[data-flip],[data-card],[data-filter],[data-del],#deal,#save,#again,#dailyCard,#close,#modal");
  if(!t) return;
  if(t.id==="modal" && e.target!==t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.sit){ state.sit=t.dataset.sit; store.set("sit",state.sit); render(); return; }
  if(t.dataset.spread){ state.spread=+t.dataset.spread; state.q=""; go("spread"); return; }
  if(t.dataset.filter){ state.filter=t.dataset.filter; render(); return; }
  if(t.dataset.card){ openCard(+t.dataset.card); return; }
  if(t.dataset.del){ const es=store.get("diary",[]); es.splice(+t.dataset.del,1); store.set("diary",es); render(); return; }
  if(t.dataset.flip!==undefined){ const k=+t.dataset.flip; if(!state.flipped[k]){ state.flipped[k]=true; state.lastOpen=k; t.classList.add("flip"); setTimeout(render,450); } return; }
  if(t.id==="deal"){ const q=$("#q"); state.q=q?q.value.trim():""; const n=D.spreads[state.spread].pos.length; state.drawn=shuffle(n); state.flipped=Array(n).fill(false); state.justDealt=true; state.lastOpen=-1; render(); return; }
  if(t.id==="again"){ state.drawn=[]; state.flipped=[]; render(); return; }
  if(t.id==="save"){ const s=D.spreads[state.spread], i=sitIdx(); const es=store.get("diary",[]);
    es.unshift({date:new Date().toLocaleDateString("es-ES"), spread:s.name, sit:state.sit, q:state.q||"", note:($("#note")||{}).value||"", cards:state.drawn.map((id,k)=>[s.pos[k], D.cards[id].name])});
    store.set("diary",es); toast("Guardado en el diario ♥"); return; }
  if(t.id==="dailyCard"){ state.daily=shuffle(1)[0]; store.set("daily",{d:today(),c:state.daily}); t.classList.add("flip"); setTimeout(render,500); return; }
  if(t.id==="close"||t.id==="modal"){ $("#modal").classList.remove("on"); return; }
});
function start(){ document.getElementById("nav").style.display=""; render(); }
(function gate(){
  const code=(window.APP_CONFIG||{}).accessCode;
  if(!code || store.get("ok","")===code){ start(); return; }
  document.getElementById("nav").style.display="none";
  $("#root").innerHTML = `<div class="gate"><div style="font-size:34px;color:var(--rose)">♥</div><h1>Tarot del <em>Amor</em> de Bolsillo</h1><p class="sub">Escribe el código de acceso que te llegó por correo.</p><input id="code" placeholder="Código de acceso" autocomplete="off"><button class="btn" id="enter">Entrar</button><p class="hint" id="err"></p></div>`;
  const tryIt=()=>{ if($("#code").value.trim().toUpperCase()===String(code).toUpperCase()){ store.set("ok",code); start(); } else { $("#err").textContent="Código incorrecto. Revisa el correo de la compra."; } };
  $("#enter").onclick=tryIt; $("#code").onkeydown=e=>{ if(e.key==="Enter") tryIt(); };
})();
</script>
</body>
</html>
